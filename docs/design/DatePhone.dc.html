<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Date and time, phone sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(13,23,20,0.38); font-family: Inter, system-ui, sans-serif; color: #0D1714; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: #F1F4F2; border-radius: 14px 14px 0 0; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 36px; height: 5px; border-radius: 3px; background: #D8DDDB; align-self: center"></div>
<div style="display: flex; align-items: center">
<button type="button" style="border: 0; background: transparent; font: inherit; font-size: 17px; color: #047857; padding: 6px 0; cursor: pointer">Očisti</button>
<p style="flex-grow: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600">Probna vožnja</p>
<button type="button" style="border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 600; color: #047857; padding: 6px 0; cursor: pointer">Gotovo</button>
</div>
<div style="display: flex; gap: 8px; overflow: hidden">
<button type="button" style="border: 0; font: inherit; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 999px; background: #047857; color: #FFFFFF; white-space: nowrap">Danas</button>
<button type="button" style="border: 0; font: inherit; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 999px; background: #FFFFFF; color: #2B3632; box-shadow: 0 0 0 1px rgba(18,38,32,0.08); white-space: nowrap">Sutra</button>
<button type="button" style="border: 0; font: inherit; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 999px; background: #FFFFFF; color: #2B3632; box-shadow: 0 0 0 1px rgba(18,38,32,0.08); white-space: nowrap">Sljedeći radni dan</button>
</div>
<div style="background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 1px rgba(18,38,32,0.08); padding: 12px 10px">
<div style="display: flex; align-items: center; padding: 0 4px 8px">
<p style="margin: 0; font-size: 17px; font-weight: 600; flex-grow: 1">Listopad 2026</p>
<button type="button" aria-label="Prethodni mjesec" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Sljedeći mjesec" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7"><div style="font-size: 12px; font-weight: 600; color: #98A39F; padding-bottom: 4px">{{w}}</div></sc-for>
<sc-for list="{{days}}" as="d" hint-placeholder-count="35"><button type="button" style="{{d.style}}">{{d.n}}</button></sc-for>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 1px rgba(18,38,32,0.08); padding: 8px 16px; display: flex; align-items: center; gap: 8px">
<p style="margin: 0; width: 90px; font-size: 17px">Vrijeme</p>
<div style="flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; gap: 4px; height: 150px">
<div style="position: absolute; left: 0; right: 0; top: 57px; height: 36px; border-radius: 8px; background: #EDEFEE"></div>
<div role="listbox" aria-label="Sat" style="position: relative; width: 64px; display: flex; flex-direction: column; align-items: center">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="5"><span role="option" style="{{h.style}}">{{h.v}}</span></sc-for>
</div>
<span style="position: relative; font-size: 22px; font-weight: 600">:</span>
<div role="listbox" aria-label="Minute" style="position: relative; width: 64px; display: flex; flex-direction: column; align-items: center">
<sc-for list="{{minutes}}" as="m" hint-placeholder-count="5"><span role="option" style="{{m.style}}">{{m.v}}</span></sc-for>
</div>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #5B6763; text-align: center">Četvrtak, 1. listopada 2026. u 14:35 · svaka minuta, kotač se vrti prstom</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const base = 'height: 44px; border: 0; font: inherit; font-size: 17px; border-radius: 999px; font-variant-numeric: tabular-nums;';
const days = [];
[28, 29, 30].forEach((n) => days.push({ n, style: base + 'background: transparent; color: #C3CAC7;' }));
for (let n = 1; n <= 31; n++) {
const weekday = (n + 2) % 7;
let style = base + 'background: transparent; color: ' + (weekday >= 5 ? '#5B6763' : '#0D1714') + ';';
if (n === 1) style = base + 'background: #047857; color: #FFFFFF; font-weight: 600;';
days.push({ n, style });
}
days.push({ n: 1, style: base + 'background: transparent; color: #C3CAC7;' });
const wheel = (values, pick) => values.map((v, i) => {
const away = Math.abs(i - values.indexOf(pick));
const size = away === 0 ? 22 : away === 1 ? 19 : 16;
const color = away === 0 ? '#0D1714' : away === 1 ? '#5B6763' : '#98A39F';
return { v, style: 'height: 30px; line-height: 30px; font-size: ' + size + 'px; font-weight: ' + (away === 0 ? 600 : 400) + '; color: ' + color + '; font-variant-numeric: tabular-nums;' };
});
return {
weekdays: ['Po', 'Ut', 'Sr', 'Če', 'Pe', 'Su', 'Ne'],
days,
hours: wheel(['12', '13', '14', '15', '16'], '14'),
minutes: wheel(['33', '34', '35', '36', '37'], '35'),
};
}
}
</script>
</body>
</html>
