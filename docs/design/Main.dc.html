<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Date field, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047857}a:hover{color:#065f46}
</style>
</helmet>
<div style="width: 760px; height: 600px; box-sizing: border-box; padding: 40px 48px; background: #F1F4F2; font-family: Inter, system-ui, sans-serif; color: #0D1714; display: flex; gap: 40px">
<div style="width: 300px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B6763">Isporuka</p>
<div style="background: #FFFFFF; border-radius: 10px; box-shadow: 0 0 0 1px rgba(18,38,32,0.08); padding: 4px 16px">
<div style="display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(18,38,32,0.11)">
<label for="d1" style="width: 104px; font-size: 15px; color: #2B3632">Datum</label>
<div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; background: #EDEFEE; border-radius: 7px; padding: 6px 10px; box-shadow: 0 0 0 2px #047857">
<input id="d1" value="15.10.2026." style="border: 0; background: transparent; font: inherit; font-size: 15px; width: 100%; color: #0D1714; outline: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
</div>
</div>
<div style="display: flex; align-items: center; min-height: 44px">
<label for="d2" style="width: 104px; font-size: 15px; color: #2B3632">Rok</label>
<div style="flex-grow: 1; background: #EDEFEE; border-radius: 7px; padding: 6px 10px; font-size: 15px; color: #98A39F">npr. 30.9. ili +7</div>
</div>
</div>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: #5B6763">Tipkanje ostaje: „30.9.” dopunjuje godinu, „+7” je za tjedan dana. Kalendar je za one koji radije biraju.</p>
</div>
<div style="width: 324px; align-self: flex-start; margin-top: 74px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 16px 40px rgba(13,23,20,0.16), 0 0 0 1px rgba(18,38,32,0.08); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" style="border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #0D1714; padding: 4px 6px; border-radius: 7px; display: flex; align-items: center; gap: 4px; cursor: pointer">Listopad 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="flex-grow: 1"></div>
<button type="button" aria-label="Prethodni mjesec" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Sljedeći mjesec" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7"><div style="font-size: 11px; font-weight: 600; color: #98A39F; padding: 4px 0">{{w}}</div></sc-for>
<sc-for list="{{days}}" as="d" hint-placeholder-count="35"><button type="button" style="{{d.style}}">{{d.n}}</button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(18,38,32,0.11)">
<button type="button" style="border: 0; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; background: #E6F2EE; color: #047857; cursor: pointer">Danas</button>
<button type="button" style="border: 0; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; background: #EDEFEE; color: #2B3632; cursor: pointer">Sutra</button>
<button type="button" style="border: 0; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; background: #EDEFEE; color: #2B3632; cursor: pointer">Za 7 dana</button>
<button type="button" style="border: 0; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 999px; background: #EDEFEE; color: #2B3632; cursor: pointer">Kraj mjeseca</button>
</div>
<p style="margin: 0; font-size: 12px; color: #5B6763">Strelice mijenjaju dan, PgUp/PgDn mjesec, Enter bira.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const base = 'height: 36px; border: 0; font: inherit; font-size: 14px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums;';
const days = [];
const lead = [28, 29, 30];
lead.forEach((n) => days.push({ n, style: base + 'background: transparent; color: #C3CAC7;' }));
for (let n = 1; n <= 31; n++) {
const weekday = (n + 2) % 7; // 0 = Monday … 6 = Sunday (1 Oct 2026 is a Thursday)
let style = base + 'background: transparent; color: ' + (weekday >= 5 ? '#5B6763' : '#0D1714') + ';';
if (n === 1) style = base + 'background: transparent; color: #047857; font-weight: 700; box-shadow: inset 0 0 0 1.5px #047857;';
if (n === 15) style = base + 'background: #047857; color: #FFFFFF; font-weight: 600;';
days.push({ n, style });
}
days.push({ n: 1, style: base + 'background: transparent; color: #C3CAC7;' });
return { weekdays: ['Po', 'Ut', 'Sr', 'Če', 'Pe', 'Su', 'Ne'], days };
}
}
</script>
</body>
</html>
