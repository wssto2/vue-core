<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Photo viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1000px; height: 640px; box-sizing: border-box; background: #0B1210; font-family: Inter, system-ui, sans-serif; color: #F1F5F3; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 18px">
<p style="margin: 0; font-size: 15px; font-weight: 600">VW Golf 8 · 3 / 12</p>
<div style="flex-grow: 1"></div>
<button type="button" aria-label="Umanji" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6"></path></svg></button>
<p style="margin: 0; width: 52px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums">200 %</p>
<button type="button" aria-label="Uvećaj" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6M11 8v6"></path></svg></button>
<button type="button" aria-label="Zakreni" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
<button type="button" aria-label="Preuzmi" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"></path></svg></button>
<button type="button" aria-label="Zatvori" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; gap: 16px; padding: 0 18px">
<button type="button" aria-label="Prethodna" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<div style="flex-grow: 1; height: 420px; border-radius: 6px; background: #2A3431; display: flex; align-items: center; justify-content: center; position: relative">
<p style="margin: 0; font-size: 14px; color: #98A39F">[FOTOGRAFIJA VOZILA, UVEĆANO 200 %]</p>
<div style="position: absolute; right: 14px; bottom: 14px; width: 120px; height: 80px; border-radius: 6px; background: rgba(0,0,0,0.5); box-shadow: 0 0 0 1px rgba(255,255,255,0.2)">
<div style="margin: 18px 0 0 34px; width: 56px; height: 38px; box-shadow: 0 0 0 2px #6EE7B7; border-radius: 3px"></div>
</div>
</div>
<button type="button" aria-label="Sljedeća" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F5F3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
<div style="display: flex; gap: 8px; justify-content: center; padding: 16px 18px 20px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="8"><button type="button" aria-label="{{t.label}}" style="{{t.style}}"></button></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const thumbs = [];
for (let i = 1; i <= 8; i++) {
thumbs.push({ label: 'Fotografija ' + i, style: 'width: 64px; height: 44px; border: 0; border-radius: 5px; background: #2A3431;' + (i === 3 ? ' box-shadow: 0 0 0 2px #6EE7B7;' : ' opacity: 0.6;') });
}
return { thumbs };
}
}
</script>
</body>
</html>
